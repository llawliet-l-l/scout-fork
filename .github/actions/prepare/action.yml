name: Prepare
description: 'Set up Node 24 and Yarn 4 and install dependencies exactly as locked.'

runs:
  using: 'composite'
  steps:
    - name: Enable Corepack
      run: corepack enable
      shell: 'bash'

    - name: Setup NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'yarn'

    - name: Install packages
      run: yarn install --immutable
      shell: 'bash'
